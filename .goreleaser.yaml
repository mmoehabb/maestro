version: 2
project_name: maestro

before:
  hooks:
    - go mod tidy

builds:
  - id: maestro
    main: ./cmd/maestro
    binary: maestro
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/mmoehabb/maestro/internal/version.Version={{ .Version }}
      - -X github.com/mmoehabb/maestro/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/mmoehabb/maestro/internal/version.Date={{ .Date }}

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# Homebrew tap and Scoop bucket are added once the tap/bucket repos exist (P4).
